[project]
name = "pace"
version = "0.1.0"
description = "PACE: bounded-latency streaming event-level sound event detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.10",
    "numpy>=1.26",
    "pandas<3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "sed-eval>=0.2.1",
    # dcase_util (pulled in by sed_eval) imports pkg_resources, removed in setuptools 81.
    "sed-scores-eval>=0.0.4",
    "setuptools<81",
    "soundfile>=0.12",
    "torch>=2.2",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
hub = ["huggingface_hub>=0.24"]
# Pretty training preamble (panels / tables). Falls back to plain text if absent.
rich = ["rich>=13.0"]

# Platform-aware torch builds.
#   - Linux + NVIDIA: resolve the CUDA wheel index.
#   - macOS (Apple Silicon): PyTorch ships CPU/MPS arm64 wheels on its own
#     index; the CUDA index has no macOS builds, so darwin resolves CPU.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "ruff==0.15.15",
]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# scripts/*.py run standalone (not `python -m`), so they need sys.path
# patched with the repo root before their src.* imports resolve.
"scripts/**/*.py" = ["E402"]
